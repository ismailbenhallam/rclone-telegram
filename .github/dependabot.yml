version: 2
updates:
  # Go modules. rclone itself is tracked by the "Track rclone releases"
  # workflow, which also publishes a release.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/rclone/rclone
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
