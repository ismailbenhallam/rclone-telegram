name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: make vet
      - name: Test
        run: go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./backend/...
      - name: Build
        run: go build -trimpath -o rclone-telegram${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
